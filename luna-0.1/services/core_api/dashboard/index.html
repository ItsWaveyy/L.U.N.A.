<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07090b"
    >

    <title>L.U.N.A.</title>

    <link
        rel="stylesheet"
        href="/dashboard/style.css"
    >
</head>

<body>

    <main id="luna-app">

        <!-- =====================================================
             FIXED COMMAND BAR
             ===================================================== -->

        <header id="command-bar">

            <div class="brand-block">
                <div class="brand-mark">
                    L.U.N.A.
                </div>

                <div class="brand-subtitle">
                    LOWKEY USEFUL NEURAL ASSISTANT
                </div>
            </div>


            <div id="runtime-status">

                <span
                    id="runtime-status-dot"
                    class="status-dot"
                ></span>

                <div class="runtime-status-text">
                    <span id="runtime-state">
                        CONNECTING
                    </span>

                    <span id="runtime-message">
                        Initializing L.U.N.A.
                    </span>
                </div>

            </div>


            <div id="human-controls">

                <button
                    id="mute-button"
                    class="command-button"
                    type="button"
                    aria-label="Mute microphone"
                >
                    <span class="command-icon">MIC</span>
                    <span class="command-label">MUTE</span>
                </button>


                <button
                    id="listening-button"
                    class="command-button"
                    type="button"
                    aria-label="Toggle listening"
                >
                    <span class="command-icon">◉</span>
                    <span class="command-label">LISTEN</span>
                </button>


                <button
                    id="reconnect-button"
                    class="command-button"
                    type="button"
                    aria-label="Reconnect L.U.N.A."
                >
                    <span class="command-icon">↻</span>
                    <span class="command-label">RECONNECT</span>
                </button>


                <button
                    id="restart-button"
                    class="command-button danger"
                    type="button"
                    aria-label="Restart L.U.N.A."
                >
                    <span class="command-icon">⟳</span>
                    <span class="command-label">RESTART</span>
                </button>

            </div>

        </header>


        <!-- =====================================================
             MAIN L.U.N.A. CANVAS
             ===================================================== -->

        <section
            id="luna-canvas"
            aria-label="L.U.N.A. presentation canvas"
        >

            <!--
                L.U.N.A. owns this space.

                app.js will dynamically render:
                - idle states
                - thinking states
                - speaking visualizations
                - weather
                - search results
                - updates
                - progress
                - timers
                - maps
                - media
                - conversations
                - future generated UI
            -->

            <div
                id="canvas-background"
                aria-hidden="true"
            ></div>


            <div
                id="canvas-content"
                aria-live="polite"
            >

                <div
                    id="canvas-boot"
                    class="canvas-view"
                >

                    <div class="boot-mark">
                        L.U.N.A.
                    </div>

                    <div
                        id="boot-status"
                        class="boot-status"
                    >
                        INITIALIZING
                    </div>

                    <div
                        id="boot-progress"
                        class="boot-progress"
                    >
                        <div
                            id="boot-progress-bar"
                            class="boot-progress-bar"
                        ></div>
                    </div>

                </div>


                <div
                    id="canvas-idle"
                    class="canvas-view hidden"
                >

                    <div class="idle-orb"></div>

                    <div class="idle-text">
                        <span id="idle-state-text">
                            READY
                        </span>

                        <span id="idle-subtext">
                            L.U.N.A. ONLINE
                        </span>
                    </div>

                </div>


                <div
                    id="canvas-thinking"
                    class="canvas-view hidden"
                >

                    <div class="thinking-core">
                        <div class="thinking-ring ring-one"></div>
                        <div class="thinking-ring ring-two"></div>
                        <div class="thinking-ring ring-three"></div>
                        <div class="thinking-center"></div>
                    </div>

                    <div class="thinking-label">
                        THINKING
                    </div>

                    <div
                        id="thinking-message"
                        class="canvas-caption"
                    >
                        Processing
                    </div>

                </div>


                <div
                    id="canvas-speaking"
                    class="canvas-view hidden"
                >

                    <div class="voice-visualizer">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                    <div class="speaking-label">
                        L.U.N.A.
                    </div>

                    <div
                        id="speaking-message"
                        class="canvas-caption"
                    >
                        Speaking
                    </div>

                </div>


                <div
                    id="canvas-listening"
                    class="canvas-view hidden"
                >

                    <div class="listening-indicator">

                        <div class="listening-core"></div>

                        <div class="listening-ring"></div>

                    </div>

                    <div class="listening-label">
                        LISTENING
                    </div>

                </div>


                <div
                    id="canvas-working"
                    class="canvas-view hidden"
                >

                    <div class="working-indicator">

                        <div class="working-line"></div>
                        <div class="working-line"></div>
                        <div class="working-line"></div>

                    </div>

                    <div class="working-label">
                        WORKING
                    </div>

                    <div
                        id="working-message"
                        class="canvas-caption"
                    >
                        Working
                    </div>

                </div>


                <div
                    id="canvas-updating"
                    class="canvas-view hidden"
                >

                    <div class="update-container">

                        <div class="update-label">
                            L.U.N.A. UPDATE
                        </div>

                        <div
                            id="update-message"
                            class="canvas-caption"
                        >
                            Applying update
                        </div>

                        <div class="update-progress">

                            <div
                                id="update-progress-bar"
                                class="update-progress-bar"
                            ></div>

                        </div>

                        <div
                            id="update-percent"
                            class="update-percent"
                        >
                            0%
                        </div>

                    </div>

                </div>


                <div
                    id="canvas-researching"
                    class="canvas-view hidden"
                >

                    <div class="research-indicator">

                        <div class="research-orbit"></div>

                        <div class="research-core"></div>

                    </div>

                    <div class="research-label">
                        RESEARCHING
                    </div>

                    <div
                        id="research-message"
                        class="canvas-caption"
                    >
                        Searching
                    </div>

                </div>


                <!--
                    Generic presentation container.

                    This is where future L.U.N.A.-controlled
                    visual objects will be mounted.
                -->

                <div
                    id="canvas-presentation"
                    class="canvas-view hidden"
                ></div>

            </div>


            <!-- =================================================
                 CANVAS OVERLAY / SUBTLE SYSTEM INFORMATION
                 ================================================= -->

            <div
                id="canvas-overlay"
                aria-hidden="true"
            >

                <div
                    id="canvas-clock"
                    class="overlay-item"
                >
                    —
                </div>

                <div
                    id="canvas-connection"
                    class="overlay-item"
                >
                    CORE —
                </div>

            </div>

        </section>


        <!-- =====================================================
             BOOT / RESTART OVERLAY
             ===================================================== -->

        <div
            id="startup-overlay"
            class="startup-overlay hidden"
            aria-hidden="true"
        >

            <div class="startup-content">

                <div class="startup-logo">
                    L.U.N.A.
                </div>

                <div
                    id="startup-phase"
                    class="startup-phase"
                >
                    INITIALIZING
                </div>

                <div
                    id="startup-detail"
                    class="startup-detail"
                >
                    Establishing core systems
                </div>

                <div class="startup-progress">

                    <div
                        id="startup-progress-bar"
                        class="startup-progress-bar"
                    ></div>

                </div>

            </div>

        </div>


        <!-- =====================================================
             SYSTEM ALERT TOAST
             ===================================================== -->

        <div
            id="system-toast"
            class="system-toast hidden"
            role="status"
            aria-live="polite"
        >

            <div
                id="toast-severity"
                class="toast-severity"
            >
                INFO
            </div>

            <div
                id="toast-message"
                class="toast-message"
            ></div>

        </div>

    </main>


    <script src="/dashboard/app.js"></script>

</body>
</html>
